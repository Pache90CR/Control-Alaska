<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bar Restaurante Alaska - Control Total</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="179967.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pro-scroll::-webkit-scrollbar { width: 6px; }
        .pro-scroll::-webkit-scrollbar-track { background: #0f172a; border-radius: 8px; }
        .pro-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }
        
        @media print {
            body { background-color: white !important; color: black !important; margin: 0; padding: 0; }
            #app-container, .no-print { display: none !important; }
            #ticket-container { display: block !important; width: 100%; max-width: 80mm; margin: 0 auto; padding: 0; font-family: 'Courier New', Courier, monospace; color: black; }
            @page { margin: 0; }
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans antialiased h-screen w-full max-w-[100vw] selection:bg-amber-500 selection:text-slate-900">

    <div id="ticket-container" class="hidden"></div>

    <div id="app-container" class="flex flex-col h-screen overflow-hidden w-full relative">

        <!-- DIÁLOGOS PERSONALIZADOS -->
        <div id="modal-custom-alert" class="fixed inset-0 bg-slate-950/90 z-[80] flex items-center justify-center p-4 hidden backdrop-blur-sm no-print">
            <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-sm shadow-2xl text-center">
                <div class="w-12 h-12 rounded-full bg-amber-500/20 text-amber-500 flex items-center justify-center text-2xl mx-auto mb-4"><i class="fa-solid fa-bell"></i></div>
                <p id="alert-msg" class="text-slate-200 text-lg mb-6"></p>
                <button onclick="window.cerrarAlert()" class="w-full bg-amber-500 text-slate-900 font-bold py-3 rounded-xl">Aceptar</button>
            </div>
        </div>

        <div id="modal-custom-confirm" class="fixed inset-0 bg-slate-950/90 z-[80] flex items-center justify-center p-4 hidden backdrop-blur-sm no-print">
            <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-sm shadow-2xl text-center">
                <div class="w-12 h-12 rounded-full bg-rose-500/20 text-rose-500 flex items-center justify-center text-2xl mx-auto mb-4"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <p id="confirm-msg" class="text-slate-200 text-lg mb-6"></p>
                <div class="flex gap-3">
                    <button onclick="window.cancelarConfirm()" class="flex-1 bg-slate-800 text-slate-300 font-bold py-3 rounded-xl border border-slate-700">Cancelar</button>
